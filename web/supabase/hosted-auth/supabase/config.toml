# Narrow hosted development Auth policy. Other hosted resources remain unchanged.
# This directory is a CLI workdir; always supply the intended --project-ref explicitly.
project_id = "profitplate-auth-development"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
minimum_password_length = 12

[auth.email]
enable_confirmations = true
secure_password_change = true
